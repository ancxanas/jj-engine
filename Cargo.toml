[package]
name = "avcs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "avcs"
path = "src/main.rs"

[lib]
name = "avcs_lib"
path = "src/lib.rs"

[dependencies]
jj-lib = { git = "https://github.com/martinvonz/jj", rev = "d52755b8dbd43291be6cb106b65e645c5b4448a0" }
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
petgraph = "0.6"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
owo-colors = "4"
comfy-table = "7"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
