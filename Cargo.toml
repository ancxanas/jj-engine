[package]
name = "avcs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "avcs"
path = "src/main.rs"

[lib]
name = "avcs_lib"
path = "src/lib.rs"

[dependencies]
globset = "0.4.14"
git2 = "0.20"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
owo-colors = "4"
comfy-table = "7"
notify = "7"
notify-debouncer-mini = "0.5"
log = "0.4"
env_logger = "0.11"
flexi_logger = "0.27"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
tokio = { version = "1", features = ["full"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
